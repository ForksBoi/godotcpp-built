name: Build and Release godot-cpp

on:
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when upstream has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: godot-cpp-upstream-build
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      branch: ${{ steps.check.outputs.branch }}
      upstream_ref: ${{ steps.check.outputs.upstream_ref }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      godot_release: ${{ steps.check.outputs.godot_release }}
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and generate API from latest stable Godot
        id: api
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/godot-release.json"
          curl -fsSL https://api.github.com/repos/godotengine/godot/releases/latest -o "$release_json"
          mapfile -t release_values < <(python - "$release_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as release_file:
              release = json.load(release_file)

          assets = [
              asset for asset in release["assets"]
              if asset["name"].endswith("_linux.x86_64.zip")
              and "mono" not in asset["name"].lower()
              and "console" not in asset["name"].lower()
          ]
          if len(assets) != 1:
              raise SystemExit("Could not uniquely find the standard Linux Godot editor asset.")

          print(release["tag_name"])
          print(assets[0]["browser_download_url"])
          PY
          )
          godot_release="${release_values[0]}"
          godot_url="${release_values[1]}"
          curl -fL --retry 3 "$godot_url" -o "$RUNNER_TEMP/godot-stable.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot-stable.zip" -d "$RUNNER_TEMP/godot"
          godot_bin="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          if [[ -z "$godot_bin" ]]; then
            echo "The Godot archive did not contain the expected Linux editor executable." >&2
            exit 1
          fi
          chmod +x "$godot_bin"
          mkdir -p generated-api
          (cd generated-api && "$godot_bin" --headless --dump-extension-api --dump-gdextension-interface-json)
          test -s generated-api/extension_api.json
          test -s generated-api/gdextension_interface.json
          version="$(python -c 'import json; h=json.load(open("generated-api/extension_api.json"))["header"]; print("{}.{}.{}".format(h["version_major"], h["version_minor"], h["version_patch"]))')"
          {
            echo "godot_release=$godot_release"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check upstream and API version
        id: check
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force }}
          GODOT_RELEASE: ${{ steps.api.outputs.godot_release }}
        run: |
          set -euo pipefail

          upstream_info="$(git ls-remote --symref https://github.com/godotengine/godot-cpp.git HEAD)"
          upstream_ref="$(awk '$1 == "ref:" && $3 == "HEAD" { print $2 }' <<< "$upstream_info")"
          upstream_sha="$(awk '$2 == "HEAD" { print $1 }' <<< "$upstream_info")"
          if [[ -z "$upstream_ref" || -z "$upstream_sha" ]]; then
            echo "Could not resolve the official repository's default branch." >&2
            exit 1
          fi

          version="$(python -c 'import json; h=json.load(open("generated-api/extension_api.json"))["header"]; print("{}.{}.{}".format(h["version_major"], h["version_minor"], h["version_patch"]))')"
          branch="v${version}"
          previous_sha=""
          previous_godot_release=""
          if git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" >/dev/null 2>&1; then
            previous_sha="$(git show "refs/remotes/origin/${branch}:.upstream-commit" 2>/dev/null || true)"
            previous_godot_release="$(git show "refs/remotes/origin/${branch}:.godot-release" 2>/dev/null || true)"
          fi

          changed=false
          if [[ "${FORCE_BUILD:-false}" == "true" || "$upstream_sha" != "$previous_sha" || "$GODOT_RELEASE" != "$previous_godot_release" ]]; then
            changed=true
          fi

          {
            echo "changed=$changed"
            echo "version=$version"
            echo "branch=$branch"
            echo "upstream_ref=$upstream_ref"
            echo "upstream_sha=$upstream_sha"
            echo "godot_release=$GODOT_RELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Godot API version: $version"
          echo "Godot stable release: $GODOT_RELEASE"
          echo "Upstream: $upstream_ref at $upstream_sha"
          echo "Build required: $changed"

      - name: Upload generated API files
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-godot-api
          path: generated-api/
          if-no-files-found: error

  build:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            artifact_platform: linux
            os: ubuntu-latest
          - platform: windows
            arch: x86_64
            artifact_platform: windows
            os: windows-latest
          - platform: macos
            arch: universal
            artifact_platform: macos
            os: macos-latest
          - platform: android
            arch: arm64
            artifact_platform: android
            os: ubuntu-latest
          - platform: android
            arch: x86_64
            artifact_platform: android
            os: ubuntu-latest
          - platform: android
            arch: arm32
            artifact_platform: android
            os: ubuntu-latest
          - platform: android
            arch: x86_32
            artifact_platform: android
            os: ubuntu-latest
          - platform: ios
            arch: universal
            artifact_platform: ios-device
            os: macos-latest
          - platform: ios
            arch: universal
            artifact_platform: ios-simulator
            ios_simulator: true
            os: macos-latest
          - platform: web
            arch: wasm32
            artifact_platform: web
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Checkout official godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ needs.discover.outputs.upstream_sha }}
          path: source
          persist-credentials: false

      - name: Download generated API files
        uses: actions/download-artifact@v4
        with:
          name: generated-godot-api
          path: generated-api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up Android SDK and NDK
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [[ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            curl -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --licenses <<< "y\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny" >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.1.13356709"

      - name: Set up Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14

      - name: Build library and generated bindings
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          IOS_SIMULATOR: ${{ matrix.ios_simulator || false }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/generated-api/extension_api.json" source/extension_api.json
          cp "$GITHUB_WORKSPACE/generated-api/gdextension_interface.json" source/gdextension/gdextension_interface.json
          cd source
          if [[ "$PLATFORM" == "ios" ]]; then
            export IOS_TOOLCHAIN_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          fi
          scons platform="$PLATFORM" arch="$ARCH" target=template_release \
            generate_bindings=yes custom_api_file=extension_api.json \
            ios_simulator="$IOS_SIMULATOR" -j2

      - name: Package SDK
        shell: bash
        env:
          VERSION: ${{ needs.discover.outputs.version }}
          ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p source/sdk/include source/sdk/bin
          cp -R source/include/. source/sdk/include/
          cp -R source/gen/include/. source/sdk/include/
          cp -R source/bin/. source/sdk/bin/
          cp generated-api/extension_api.json source/sdk/extension_api.json
          archive="godot-cpp-${VERSION}-${ARTIFACT_PLATFORM}-${ARCH}.tar.gz"
          tar -czf "$archive" -C source/sdk .

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-cpp-${{ needs.discover.outputs.version }}-${{ matrix.artifact_platform }}-${{ matrix.arch }}
          path: godot-cpp-${{ needs.discover.outputs.version }}-${{ matrix.artifact_platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [discover, build]
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated API files
        uses: actions/download-artifact@v4
        with:
          name: generated-godot-api
          path: ${{ runner.temp }}/generated-api

      - name: Save API and update version branch
        shell: bash
        env:
          BRANCH: ${{ needs.discover.outputs.branch }}
          UPSTREAM_REF: ${{ needs.discover.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream_sha }}
          GODOT_RELEASE: ${{ needs.discover.outputs.godot_release }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/godotengine/godot-cpp.git
          git fetch --no-tags upstream "$UPSTREAM_REF"
          git checkout --orphan "$BRANCH" "$UPSTREAM_SHA"
          git rm -r --cached --ignore-unmatch .github/workflows
          cp "$RUNNER_TEMP/generated-api/extension_api.json" extension_api.json
          cp "$RUNNER_TEMP/generated-api/gdextension_interface.json" gdextension/gdextension_interface.json
          printf '%s\n' "$UPSTREAM_SHA" > .upstream-commit
          printf '%s\n' "$GODOT_RELEASE" > .godot-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension_api.json gdextension/gdextension_interface.json .upstream-commit .godot-release
          git commit -m "Sync godot-cpp ${UPSTREAM_SHA:0:12} for ${BRANCH}"
          git push origin "HEAD:refs/heads/${BRANCH}" --force
          git tag --force "$BRANCH" HEAD
          git push origin "refs/tags/${BRANCH}" --force

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.branch }}
          name: ${{ needs.discover.outputs.branch }}
          target_commitish: ${{ needs.discover.outputs.branch }}
          body: |
            Built from `godotengine/godot-cpp` commit `${{ needs.discover.outputs.upstream_sha }}`.
            Bindings and the GDExtension interface were generated by Godot `${{ needs.discover.outputs.godot_release }}`.
          files: artifacts/*
          overwrite_files: true
          generate_release_notes: true
